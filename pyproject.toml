[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-automation"
version = "0.5.2"
description = "Reusable utility toolkit for ecommerce automation projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
config = ["python-dotenv>=1.0,<2"]
http = ["httpx>=0.27,<1"]
notify = ["httpx>=0.27,<1"]
ai = ["openai>=1,<2"]
dingtalk = ["httpx>=0.27,<1"]
mysql = ["PyMySQL>=1.1,<2", "DBUtils>=3.1,<4"]
redis = ["redis>=5,<8"]
browser = ["playwright>=1.40,<2"]
all = [
  "python-dotenv>=1.0,<2", "httpx>=0.27,<1", "PyMySQL>=1.1,<2",
  "DBUtils>=3.1,<4", "redis>=5,<8", "playwright>=1.40,<2", "openai>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecommerce_automation = ["py.typed"]
